[package]
name = "claude-healthline"
version = "0.1.0"
edition = "2021"
description = "A fast, never-blank Claude Code status line that tells you when your agent is going wrong: agent-health score, MCP servers needing attention, context %, and live spend."
license = "MIT"
repository = "https://github.com/decebal/claude-healthline"
homepage = "https://github.com/decebal/claude-healthline"
readme = "README.md"
keywords = ["claude-code", "statusline", "agent-health", "observability", "cli"]
categories = ["command-line-utilities"]
authors = ["decebal"]

[[bin]]
name = "claude-healthline"
path = "src/main.rs"

# Companion hook: populates the OBSERVABLE agent-health dimensions (stability +
# drift) from real tool outcomes. Wire to PostToolUse / PostToolUseFailure.
[[bin]]
name = "claude-health-hook"
path = "src/bin/claude-health-hook.rs"

# Companion hook: fills the SUBJECTIVE dimensions (rules / truth / task) by
# handing the last turn to a cheap judge model. Wire to Stop.
[[bin]]
name = "claude-health-report"
path = "src/bin/claude-health-report.rs"

# Companion hook: records MCP server health (name + status ONLY — never the
# server argv, which carries API keys). Wire to SessionStart.
[[bin]]
name = "claude-mcp-probe"
path = "src/bin/claude-mcp-probe.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
