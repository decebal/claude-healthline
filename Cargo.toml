[package]
name = "claude-statusline"
version = "0.1.0"
edition = "2021"
description = "A fast, never-blank Claude Code status line: powerline + Nerd-Font segments for model, git, context %, cost + burn rate + today's spend, and more."
license = "MIT"
repository = "https://github.com/decebal/claude-statusline"
homepage = "https://github.com/decebal/claude-statusline"
readme = "README.md"
keywords = ["claude", "claude-code", "statusline", "cli", "powerline"]
categories = ["command-line-utilities"]
authors = ["decebal"]

[[bin]]
name = "claude-statusline"
path = "src/main.rs"

# Companion hook: populates the OBSERVABLE agent-health dimensions (stability +
# drift) from real tool outcomes. Wire to PostToolUse / PostToolUseFailure.
[[bin]]
name = "claude-health-hook"
path = "src/bin/claude-health-hook.rs"

# Companion hook: fills the SUBJECTIVE dimensions (rules / truth / task) by
# handing the last turn to a cheap judge model. Wire to Stop.
[[bin]]
name = "claude-health-report"
path = "src/bin/claude-health-report.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
