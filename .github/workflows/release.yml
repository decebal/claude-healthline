name: Release

# Prebuilt binaries are what actually removes the "install Rust first" bounce.
# A Claude Code plugin cannot do it: plugins may not declare a `statusLine` at
# all (only `agent` and `subagentStatusLine` are honoured in a plugin's
# settings.json), and a plugin ships scripts rather than compiled artefacts — so
# a Rust binary would still have to come from somewhere. It comes from here.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and attach to (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,  target: aarch64-apple-darwin }
          - { os: macos-latest,  target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}

      # The only target here that cannot build natively on its runner.
      - name: Cross-compilation linker (aarch64 linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc' >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # All four binaries ship together: the status line is useless for the
      # agent-health and MCP segments without the hooks that feed them, and
      # asking for four separate downloads is how people end up with three.
      - name: Package (unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          out="claude-healthline-${{ matrix.target }}"
          mkdir -p "$out"
          for b in claude-healthline claude-health-hook claude-health-report claude-mcp-probe; do
            cp "target/${{ matrix.target }}/release/$b" "$out/"
          done
          cp README.md LICENSE "$out/"
          tar -czf "$out.tar.gz" "$out"
          shasum -a 256 "$out.tar.gz" > "$out.tar.gz.sha256"

      - name: Package (windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          out="claude-healthline-${{ matrix.target }}"
          mkdir -p "$out"
          for b in claude-healthline claude-health-hook claude-health-report claude-mcp-probe; do
            cp "target/${{ matrix.target }}/release/$b.exe" "$out/"
          done
          cp README.md LICENSE "$out/"
          7z a "$out.zip" "$out"
          sha256sum "$out.zip" > "$out.zip.sha256"

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            claude-healthline-${{ matrix.target }}.tar.gz
            claude-healthline-${{ matrix.target }}.tar.gz.sha256
            claude-healthline-${{ matrix.target }}.zip
            claude-healthline-${{ matrix.target }}.zip.sha256
          fail_on_unmatched_files: false
