name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: fmt / clippy / build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

      - name: Build (release)
        run: cargo build --release

      - name: Smoke test (never-blank on garbage + empty stdin)
        shell: bash
        run: |
          bin=target/release/claude-healthline
          out=$(printf 'not json' | "$bin"); test -n "$out" || { echo "blank on garbage"; exit 1; }
          out=$(printf '' | "$bin");        test -n "$out" || { echo "blank on empty";   exit 1; }
          echo "never-blank OK"

      - name: Smoke test (caveman badge on/off)
        shell: bash
        run: |
          bin=target/release/claude-healthline
          in='{"session_id":"ci","model":{"display_name":"Opus"}}'
          cfg=$(mktemp -d)
          out=$(printf '%s' "$in" | CLAUDE_CONFIG_DIR="$cfg" CLAUDE_HEALTHLINE_ASCII=1 "$bin")
          case "$out" in *cave*) echo "badge drawn with no flag file: $out"; exit 1;; esac
          printf 'ultra' > "$cfg/.caveman-active"
          printf '\xe2\x9b\x8f 114.9k' > "$cfg/.caveman-statusline-suffix"
          out=$(printf '%s' "$in" | CLAUDE_CONFIG_DIR="$cfg" CLAUDE_HEALTHLINE_ASCII=1 "$bin")
          case "$out" in *"cave ultra · 114.9k saved"*) ;; *) echo "badge missing: $out"; exit 1;; esac
          out=$(printf '%s' "$in" | CLAUDE_CONFIG_DIR="$cfg" CLAUDE_HEALTHLINE_ASCII=1 CLAUDE_HEALTHLINE_NO_CAVEMAN=1 "$bin")
          case "$out" in *cave*) echo "opt-out ignored: $out"; exit 1;; esac
          echo "caveman badge OK"
